  - id: 18136
    slug: shadow_focus
    name: Shadow Focus
    tab: 3
    tier: 1
    col: 2
    icon: Spell_Shadow_BurningSpirit
    maxRank: 5
    prereqTalentId: 0
    prereqPoints: 5
    # 2026-09-06 final review (I-34) — RE-AUTHORED from `stat` aura 55 to a `resistMiss` SPELLMOD.
    # The shipped shape was `aura: 55` (MOD_SPELL_HIT_CHANCE) + `school: 32`, and the school was a
    # NO-OP FILTER: `StatSystem.cpp` sums SPELL_AURA_MOD_SPELL_HIT_CHANCE BARE, with no school or
    # family test, so the talent silently granted +2..10% hit with EVERY school of spell — Holy Fire,
    # Smite and Mana Burn included — instead of Shadow only. See the framework table's `op:
    # resistMiss` row. The correct encoding is SPELLMOD_RESIST_MISS_CHANCE (misc 16), which
    # `Unit::MagicSpellHitResult` adds to the caster's hit chance ONLY for a spell the mod's
    # EffectSpellClassMask matches; it is also the era-authentic encoding (TBC's own 15260-15330 use
    # it, and the TBC twin 20547 already ships this exact shape).
    # MASK (X1 lesson — every bit censused against family-6 in `ip-dbc/Spell.dbc` this round, not
    # assumed). `affects:` names the five hostile Shadow-school spells the Vanilla `_ref.spells`
    # table carries, which OR to (0x1A004, 0, 0x40): word0 bit2 Vampiric Embrace, bit13 Mind Blast,
    # bit15 Shadow Word: Pain, bit16 Psychic Scream; word2 bit6 Mind Flay. `affectsMask` restates
    # that and adds the two bits the Vanilla `_ref.spells` table has no entry for but the talent must
    # cover — word0 bit17 0x20000 Mind Control and bit25 0x2000000 Devouring Plague (both are also in
    # the TBC twin's mask). CENSUS RESULT, family 6, whole DBC: bit13 = {Mind Blast} alone, bit15 =
    # {Shadow Word: Pain}, bit16 = {Psychic Scream}, bit25 = {Devouring Plague}, word2 bit6 =
    # {Mind Flay, "Ron's Test Spell #5"}; bit2 additionally carries four AV/world-event buffs
    # (Stormpike's Salvation etc.) and bit17 five NPC mind-control spells — none of them castable by
    # a priest, so no spellmod of ours can reach them. NOTHING Holy or Discipline intersects, which
    # is the leak the old all-school aura had. Shadow Protection / Shadowguard-style buffs are
    # deliberately absent: a friendly/self buff never rolls hit.
    mechanic: spellmod
    affects:
    - 'Shadow Word: Pain'
    - Mind Blast
    - Mind Flay
    - Vampiric Embrace
    - Psychic Scream
    affectsMask: { a: 33792004, b: 0, c: 64 }   # 0x203A004 / 0 / 0x40 — see census above
    op: resistMiss
    kind: flat
    vals:
    - 2
    - 4
    - 6
    - 8
    - 10
