    # 2026-09-06 final review (F-7, CRITICAL): `flags` was 1024 = PROC_FLAG_DONE_SPELL_NONE_DMG_
    # CLASS_POS, which a priest heal NEVER raises — every one of the four named heals is
    # SPELL_DAMAGE_CLASS_MAGIC, so the talent could not fire at all. 16384 (0x4000) =
    # PROC_FLAG_DONE_SPELL_MAGIC_DMG_CLASS_POS is the flag those casts actually raise, and it is a
    # member of the TBC twin 20529's own ProcTypeMask 87376 (0x15550).
    # `typeMask: 2` (SPELL_TYPE_MASK_HEAL) is LOAD-BEARING and is the second half of the same bug:
    # the generator DEFAULTS SpellTypeMask to 1 (DAMAGE), and a heal event carries type 2, so 2 & 1
    # == 0 would reject every proc even with the right flag (the shipped Vanilla shaman Ancestral
    # Healing / Healing Way lesson; node 20529 authors it for exactly this reason).
