- id: 932960
  name: Shadow Vulnerability
  aura: 87
  basePoints: 3
  misc: 32
  school: 32
  targetA: 6
  durationIndex: 8
  stackAmount: 5
  singleAuraStack: true   # Vanilla: ONE shared 5-stack per target that every shadow priest's
                          # Shadow Weaving contributes to (like Sunder/Winter's Chill). Emits
                          # SPELL_ATTR0_CU_SINGLE_AURA_STACK via spell_custom_attr; without it
                          # a second priest's proc REPLACED the first priest's stack.
  client:
    name: Shadow Vulnerability
    icon: 9
- id: 920920                # Power Infusion (node 18115 band slot); era-safe custom Vanilla PI so
  name: Power Infusion      # stock 10060 (WotLK haste PI) stays intact for WotLK-stage priests
  template: 10060           # CLONE real PI -> inherits its SpellVisual (cast animation), attributes
                            # (0x50000), cast-time index, etc. Only the fields below are overridden.
  powerCost: 182
  manaCostPct: 0            # 2026-09-06 final review (I-20): LOAD-BEARING. Stock 10060 is
                            # ManaCostPct 16 and the core charges the flat ManaCost PLUS the
                            # percent, so the clone billed 182 + 16% of base mana until this key
                            # zeroed the inherited percent (the Lightwell/Circle-of-Healing idiom).
  rangeIndex: 4             # 30 yd
  cooldown: 180000          # 3 min (Vanilla; WotLK stock 10060 is 2 min)
  durationIndex: 8          # 15 s
  effects:                  # Vanilla PI = +20% spell dmg + healing (overrides 10060's haste/mana effects)
  - effect: 6               # APPLY_AURA
    aura: 79                # MOD_DAMAGE_PERCENT_DONE
    basePoints: 20          # +20% spell damage
    misc: 126               # all magic schools
    targetA: 21              # TARGET_UNIT_TARGET_ALLY
  - effect: 6
    aura: 136               # MOD_HEALING_DONE_PERCENT
    basePoints: 20          # +20% healing
    targetA: 21
  client:
    name: Power Infusion
    icon: 1872              # stock PI SpellIconID
    description: "Infuses the target with power, increasing their spell damage and healing by 20%. Lasts 15 sec."
    auraDescription: "Spell damage and healing increased by 20%."
    skillLine: 613          # Discipline tab (stock PI 10060 lives here) — without a SkillLineAbility
                            # row the client can't categorize a custom spell and dumps it in General
- id: 921152                # Vampiric Embrace — custom Vanilla castable (cast on an ENEMY): applies
  name: Vampiric Embrace    # ONLY the visible debuff on the mob. The heal is driven by the separate
  template: 15286           # CLONE real Vampiric Embrace -> inherits its shadow cast visual + instant
                            # cast. The heal is driven by the separate PERMANENT proc-passive 932950
                            # (granted by ReconcileBaselineSpells when the VE talent is learned), which
                            # procs on the priest's shadow damage and heals the party iff the victim
                            # carries this debuff. Era-safe: stock 15286 stays intact for WotLK priests.
  powerCost: 40
  rangeIndex: 4             # 30 yd (cast on the enemy)
  cooldown: 10000           # 10 s
  durationIndex: 3          # 60 s (the debuff on the mob)
  family: 6                 # so SPELLMODs affecting "Vampiric Embrace" (e.g. Silent Resolve) bind
  mask: 4                   # matches _ref.spells["Vampiric Embrace"].flagsA
  effects:
  - effect: 6               # APPLY_AURA — the visible debuff on the target
    aura: 4                 # DUMMY marker (checked by the C++ script via HasAura)
    basePoints: 0
    targetA: 6              # TARGET_UNIT_TARGET_ENEMY
  client:
    name: Vampiric Embrace
    icon: 150              # stock VE SpellIconID
    description: "Afflicts your target with Shadow energy that causes all party members to be healed for 20% of any Shadow damage you deal to the target for 1 min."
    auraDescription: "Party members are healed for 20% of any Shadow damage the priest deals to this target."
    skillLine: 78          # Shadow tab (stock VE 15286 lives here); see PI note re: SkillLineAbility
- id: 932950                # Vampiric Embrace — hidden PERMANENT proc-passive (no client: -> invisible)
  name: Vampiric Embrace    # PASSIVE, always on the priest; procs on shadow damage -> party heal.
  template: 15286           # CLONE real VE (itself the DUMMY proc-carrier the core VE script keys off)
                            # so the proc SpellInfo is well-formed; then override to a hidden PASSIVE.
  attributes: 262608        # PASSIVE_ATTR — learned/stripped by ReconcileBaselineSpells vs the VE talent.
  durationIndex: 0          # PERMANENT. Template 15286 is an ACTIVE self-buff (DurationIndex 30 = 30 min),
                            # and a passive clone inherits it unless overridden -> the proc-passive aura
                            # SILENTLY EXPIRED 30 min into a session, killing ALL VE healing. Reconcile
                            # can't recover it mid-session (its learn guard is `!HasSpell(932950)`, and the
                            # spell stays learned), so healing died until relog. Every other band passive
                            # uses DurationIndex 0 (null entry -> GetMaxDuration()==0 -> never expires).
  effects:
  - { effect: 6, aura: 4, basePoints: 20, targetA: 1 }   # DUMMY 20% (EFFECT_0 the AuraScript hooks), on self
  proc:
    flags: 327680           # DONE magic direct (65536) | DONE periodic (262144) — Mind Blast/SW:Pain/Mind Flay
    school: 32              # shadow
    family: 6
    attrMask: 2             # PROC_ATTR_TRIGGERED_CAN_PROC — Mind Flay damages via triggered 58381
    chance: 100
    hitMask: 0              # normal+crit+absorb (core default); NEVER 8 (=FULL_RESIST only)
- id: 932951                # Vampiric Embrace — heal delivery; script casts it per party
  name: Vampiric Embrace Heal   # member with SPELLVALUE_BASE_POINT0 = computed heal amount
  template: 15290           # CLONE real VE heal -> well-formed heal SpellInfo (15290's own 2nd self-heal
                            # effect is 0-filled by the templated effects path, leaving one ally heal)
  effects:
  - effect: 10              # SPELL_EFFECT_HEAL
    basePoints: 0
    targetA: 21             # TARGET_UNIT_TARGET_ALLY — the script casts this per party member with an
                            # explicit unit target; targetA=1 (CASTER) redirected EVERY heal onto the
                            # priest, so party members were never healed. 21 heals the passed member
                            # (matches Flash/Greater Heal/Renew). Solo still heals the priest (self).
  client: { name: Vampiric Embrace, icon: 150 }   # hidden triggered heal: without a client row the
                            # heal ticks are INVISIBLE in the combat log / floating combat text (the
                            # framework's hidden-payload gotcha — same treatment as SoC 932607). Named
                            # like stock 15290 so log lines read "Vampiric Embrace"; no skillLine, so
                            # no spellbook row.
