# --- Inspiration armor buffs r1-r3 (920987-920989; node 18123 proc-triggers them) ----------------
# 2026-09-06 FINAL REVIEW (I-23) — RE-AUTHORED from the shipped "armor PROXY" to TBC/Vanilla's real
# encoding. These shipped as aura 87 MOD_DAMAGE_PERCENT_TAKEN misc 1 (physical) at -8/-16/-25%, and
# the Vanilla fidelity audit cleared that by dumping stock 15359 and finding aura 87 there. That
# dump read the LIVE WotLK row, which is the WotLK RETUNE (-3/-7/-10% physical damage taken); the
# ERA record for 14893/15357/15359 is aura 101 MOD_RESISTANCE_PCT misc 1 (ARMOR) at +8/+16/+25 —
# see `era-data/_ref/tbc/priest-spells.yaml` reuse_ledger "920987_920988_920989" and the TBC clones
# 948057-948059, which already ship it. Aura 101 IS implemented on this core
# (`AuraEffect::HandleModResistancePercent`, SpellAuraEffects.cpp:4157), so the real +armor%
# encoding is directly authorable and the proxy is unnecessary — it also grossly OVER-delivered
# (a flat -25% physical damage taken is far stronger than +25% armor, which mitigates nonlinearly).
# basePoints/dieSides use the val-1 / ds1 convention so the rolled value is exactly 8/16/25.
# NO `skillLine:` — these land on the HEAL TARGET, never in the priest's own spellbook.
- id: 920987
  name: Inspiration (Rank 1)
  school: 2
  durationIndex: 8               # 15 s
  effects:
  - { effect: 6, aura: 101, basePoints: 7, dieSides: 1, misc: 1, targetA: 21 }    # +8% armor
  client:
    name: Inspiration
    icon: 1463                   # stock 14893 SpellIconID
    rank: 1
    description: Increases the target's armor by 8% for 15 sec.
    auraDescription: Armor increased by 8%.
- id: 920988
  name: Inspiration (Rank 2)
