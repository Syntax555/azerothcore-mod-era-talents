name: Portable integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      portable-ref:
        description: Assembly branch, tag or commit with the fixtures to check against
        default: main

permissions:
  contents: read

concurrency:
  # A newer push or pull request update replaces a running check. A manual run
  # gets its own queue, so neither cancels the other.
  group: portable-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  integration:
    # The assembly's shared workflow checks this commit with the module's fixtures.
    uses: Syntax555/mod-playerbots-portable/.github/workflows/module-integration.yml@main
    with:
      module: mod-era-talents
      portable-ref: ${{ inputs.portable-ref || 'main' }}

  addon:
    name: Test historical addon locales and Lua behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1 python3-venv
          python3 -m venv "$RUNNER_TEMP/addon-python"
          "$RUNNER_TEMP/addon-python/bin/python" -m pip install 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/addon-python/bin" >> "$GITHUB_PATH"

      - name: Test historical addon locales and Lua behavior
        run: |
          python3 tools/test_era_locales.py
          for fixture in client-addon/EraTalents/test_*.lua; do lua5.1 "$fixture"; done
