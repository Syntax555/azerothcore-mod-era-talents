name: Latest

# Every push to main publishes the rolling Latest release with EraTalents-addon-latest.zip,
# checked and packaged by the assembly's shared addon workflow.
# The previous assets stay downloadable until the new ZIP is built and checked.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest
  cancel-in-progress: false

jobs:
  latest:
    uses: Syntax555/mod-playerbots-portable/.github/workflows/addon-latest.yml@main
    with:
      asset: EraTalents-addon-latest.zip
      addons: client-addon/EraTalents:EraTalents.toc:EraTalents
      extras: LICENSE:EraTalents/LICENSE
